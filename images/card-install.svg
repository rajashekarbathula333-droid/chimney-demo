  <rect x="60" y="0" width="240" height="200" fill="#ffffff" opacity="0.5"/>
  <!-- duct to wall -->
  <rect x="150" y="10" width="60" height="30" fill="#ffffff" stroke="#0d2b3e" stroke-width="3"/>
  <path d="M120 40 L240 40 L220 84 L140 84 Z" fill="#0d2b3e"/>
  <rect x="136" y="80" width="88" height="8" rx="3" fill="#f08a24"/>
